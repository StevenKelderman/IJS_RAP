repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff           # Lint Python code
        name: Lint code with ruff
        language_version: python3.13
      - id: ruff-format    # Auto-format Python code
        name: Apply proper code style with ruff
        language_version: python3.13

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: \.py$|\.yml$|\.yaml$|\.txt$  # only relevant file types
      - id: end-of-file-fixer
        files: \.py$|\.yml$|\.yaml$|\.txt$
      - id: check-yaml
        files: \.yml$|\.yaml$  # only run on YAML files
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # warn if files larger than 1MB
